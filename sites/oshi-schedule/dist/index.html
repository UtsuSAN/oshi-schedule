<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10141d">
    <meta name="description" content="公開された推し活イベント予定を確認できます。">
    <title>推し活イベント予定</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23ff6b7e'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='38' font-family='sans-serif' font-weight='700' fill='%2310141d'%3E%E6%8E%A8%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/site.css">
    <script src="/site.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="推し活イベント予定 トップ">
        <span class="brand-mark" aria-hidden="true">推</span>
        <span class="brand-name">OSHI <span class="brand-slash">/</span> SCHEDULE</span>
      </a>
      <p class="topbar-note">公開イベントカレンダー</p>
    </header>

    <main class="page-shell">
      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">EVENT CALENDAR <span aria-hidden="true">·</span> JAPAN</p>
          <h1 id="page-title">推し活イベント予定</h1>
          <p class="heading-copy">日程、出演情報、会場と公式リンクをまとめて確認できます。</p>
        </div>
        <div class="snapshot-status" id="snapshot-status" aria-live="polite">
          <span class="status-mark" aria-hidden="true"></span>
          <span id="snapshot-updated">公開データを確認しています</span>
        </div>
      </section>

      <section class="filter-panel" aria-label="予定の表示条件">
        <div class="date-tabs" role="tablist" aria-label="表示する期間">
          <button class="date-tab" id="filter-today" type="button" role="tab" aria-selected="false" data-range="today">今日</button>
          <button class="date-tab is-active" id="filter-week" type="button" role="tab" aria-selected="true" data-range="week">今週</button>
          <button class="date-tab" id="filter-month" type="button" role="tab" aria-selected="false" data-range="month">今月</button>
        </div>
        <label class="artist-filter" for="artist-select">
          <span>アーティスト</span>
          <select id="artist-select" aria-label="アーティストで絞り込む">
            <option value="all">すべて</option>
          </select>
        </label>
        <div class="result-count" id="result-count" aria-live="polite">— 件</div>
      </section>

      <section class="events-section" aria-labelledby="events-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow" id="range-label">THIS WEEK</p>
            <h2 id="events-title">今週の予定</h2>
          </div>
          <p class="timezone-note">時刻は日本時間（JST）</p>
        </div>
        <div id="event-list" class="event-list" aria-live="polite" aria-busy="true"></div>
      </section>

      <footer class="page-footer">
        <span>掲載内容は各イベントの公式情報をご確認ください。</span>
        <span class="footer-mark">OSHI / SCHEDULE</span>
      </footer>
    </main>
  </body>
</html>
